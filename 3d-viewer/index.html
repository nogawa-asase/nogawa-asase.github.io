<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3D 作品ギャラリー</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --accent: #0f3460;
    --highlight: #e94560;
    --text: #eaeaea;
    --muted: #aaa;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f0f4f8; --surface: #fff; --accent: #e2e8f0;
      --highlight: #3b82f6; --text: #1a202c; --muted: #718096;
    }
  }
  * { box-sizing: inherit; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body { padding: 24px 16px 48px; }

  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-align: center;
    margin-bottom: 24px;
  }

  /* ── ギャラリーグリッド ── */
  #gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card:hover, .card:active {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .card .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .card .thumb img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .card .thumb .fallback-icon {
    font-size: 2.4rem;
    opacity: 0.5;
  }
  .card .thumb .badge {
    position: absolute; bottom: 6px; right: 6px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 10px;
  }
  .card .title {
    padding: 8px 10px 10px;
    font-size: 0.82rem;
    text-align: center;
  }

  /* ── モーダル ── */
  #modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  #modal-backdrop.open { display: flex; }

  #modal {
    width: 100%; max-width: 720px;
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 48px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
  }
  #modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
  }
  #modal-title { font-size: 0.95rem; font-weight: 600; }
  #modal-close {
    background: none; border: none; color: var(--text);
    font-size: 1.4rem; cursor: pointer; line-height: 1;
    padding: 4px 8px; border-radius: 8px;
  }
  #modal-close:hover { background: var(--highlight); color: #fff; }

  #modal-viewer-wrap { position: relative; }
  #modal-mv {
    width: 100%;
    height: 75vw;
    max-height: 520px;
    min-height: 280px;
    --progress-bar-color: var(--highlight);
    display: block;
  }
  #modal-loading {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--surface); gap: 12px;
    transition: opacity 0.5s;
  }
  #modal-loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 42px; height: 42px;
    border: 3px solid var(--accent);
    border-top-color: var(--highlight);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #modal-controls {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 12px 16px 16px;
  }
  #modal-controls button {
    padding: 7px 16px; border-radius: 20px; border: none;
    background: var(--accent); color: var(--text);
    font-size: 0.8rem; cursor: pointer;
  }
  #modal-controls button.active { background: var(--highlight); color: #fff; }
  #modal-controls button:hover { background: var(--highlight); color: #fff; }
</style>
</head>
<body>

<h1>🗂️ 3D 作品ギャラリー</h1>

<div id="gallery"></div>

<!-- モーダル -->
<div id="modal-backdrop" onclick="if(event.target===this) closeModal()">
  <div id="modal">
    <div id="modal-header">
      <span id="modal-title"></span>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-viewer-wrap">
      <div id="modal-loading">
        <div class="spinner"></div>
        <span style="font-size:0.8rem;color:var(--muted)">読み込み中…</span>
      </div>
      <model-viewer
        id="modal-mv"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        auto-rotate-delay="1000"
        rotation-per-second="18deg"
        environment-image="neutral"
        shadow-intensity="1.2"
        exposure="1.0"
        min-camera-orbit="auto -Infinitydeg auto"
        max-camera-orbit="auto Infinitydeg auto"
        interpolation-decay="200"
      ></model-viewer>
    </div>
    <div id="modal-controls">
      <button id="btn-rotate" class="active" onclick="toggleRotate()">⟳ 自動回転</button>
      <button onclick="resetCamera()">🎯 リセット</button>
      <button onclick="cycleEnv()">💡 照明切替</button>
    </div>
  </div>
</div>

<script>
  /* ═══════════════════════════════════════════════
     作品リスト。ここに10個分を追加してください。
     name    : ギャラリーに表示する作品名
     glb     : models/ フォルダ内のGLBファイル名
     poster  : posters/ フォルダ内のサムネイル画像名
     ═══════════════════════════════════════════════ */
  const ITEMS = [
    { name: "作品 01", glb: "models/work01.glb", poster: "posters/work01.png" },
    { name: "作品 02", glb: "models/work02.glb", poster: "posters/work02.png" },
    { name: "作品 03", glb: "models/work03.glb", poster: "posters/work03.png" },
    //{ name: "作品 04", glb: "models/work04.glb", poster: "posters/work04.jpg" },
    //{ name: "作品 05", glb: "models/work05.glb", poster: "posters/work05.jpg" },
    //{ name: "作品 06", glb: "models/work06.glb", poster: "posters/work06.jpg" },
    //{ name: "作品 07", glb: "models/work07.glb", poster: "posters/work07.jpg" },
    //{ name: "作品 08", glb: "models/work08.glb", poster: "posters/work08.jpg" },
    //{ name: "作品 09", glb: "models/work09.glb", poster: "posters/work09.jpg" },
    //{ name: "作品 10", glb: "models/work10.glb", poster: "posters/work10.jpg" },
  ];

  const gallery = document.getElementById('gallery');
  ITEMS.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openModal(item);
    card.innerHTML = `
      <div class="thumb">
        <img src="${item.poster}" alt="${item.name}"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="fallback-icon" style="display:none; position:absolute; inset:0; align-items:center; justify-content:center;">📦</div>
        <span class="badge">3D</span>
      </div>
      <div class="title">${item.name}</div>
    `;
    gallery.appendChild(card);
  });

  /* ── モーダル制御 ── */
  const backdrop = document.getElementById('modal-backdrop');
  const mv = document.getElementById('modal-mv');
  const loading = document.getElementById('modal-loading');
  const titleEl = document.getElementById('modal-title');
  let autoRotate = true;
  let envIndex = 0;
  const envs = ['neutral', 'legacy', 'commerce'];

  function openModal(item) {
    titleEl.textContent = item.name;
    loading.classList.remove('hidden');
    mv.src = item.glb;
    backdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    backdrop.classList.remove('open');
    mv.src = '';               // メモリ解放のため読み込みを止める
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  mv.addEventListener('load', () => loading.classList.add('hidden'));
  mv.addEventListener('error', () => {
    loading.innerHTML = '<p style="color:var(--highlight);font-size:0.85rem;padding:12px;text-align:center">⚠️ 読み込みに失敗しました</p>';
  });

  function toggleRotate() {
    autoRotate = !autoRotate;
    mv.autoRotate = autoRotate;
    document.getElementById('btn-rotate').classList.toggle('active', autoRotate);
  }
  function resetCamera() {
    mv.cameraOrbit = 'auto auto auto';
    mv.cameraTarget = 'auto auto auto';
    mv.fieldOfView = 'auto';
  }
  function cycleEnv() {
    envIndex = (envIndex + 1) % envs.length;
    mv.environmentImage = envs[envIndex];
  }
</script>

</body>
</html>
